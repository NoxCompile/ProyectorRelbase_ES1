<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TREWA | Eliminar Registro</title>
    <style>
        body { font-family: -apple-system, Arial, sans-serif; background-color: #f4f6f9; padding: 40px; }
        .container { max-width: 500px; background: white; padding: 30px; border-radius: 8px; margin: 0 auto; border-top: 5px solid #c62828; }
        .btn-danger { background-color: #c62828; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-cancel { background-color: #ccc; color: #333; text-decoration: none; padding: 10px 15px; border-radius: 4px; margin-left: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>⚠️ Confirmar Eliminación</h2>
        <p>¿Está seguro que desea dar de baja el registro logístico de <strong>{{ registro.producto }}</strong>?</p>
        <p style="font-size: 13px; color: #666;">Nota: Esta acción realizará un borrado lógico para auditoría.</p>
        
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn-danger">Sí, eliminar registro</button>
            <a href="{% url 'lista' %}" class="btn-cancel">Cancelar</a>
        </form>
    </div>
</body>
</html>
