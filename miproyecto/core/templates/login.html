<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TREWA | Acceso Logístico</title>
    <style>
        body { font-family: -apple-system, Arial, sans-serif; background-color: #103084; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 100%; max-width: 350px; text-align: center; }
        h2 { color: #103084; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 10px 0 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { background-color: #20dfa4; color: #103084; font-weight: 900; text-transform: uppercase; padding: 12px; border: none; border-radius: 4px; width: 100%; cursor: pointer; }
        .error { color: #c62828; font-size: 13px; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>TREWA Logística</h2>
        
        <!-- Bloque para mostrar mensajes de error de Django -->
        {% if messages %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Nombre de usuario" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit" class="btn">Ingresar al Sistema</button>
        </form>
    </div>
</body>
</html>
